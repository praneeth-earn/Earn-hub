<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Sign Up - EarnHub</title><link rel="stylesheet" href="style.css"></head>
<body class="auth-page"><div class="auth-box"><div class="logo">Earn<span>Hub</span></div><h1>Create account 🚀</h1><p>Join and start earning rewards.</p><form onsubmit="signup(event)"><label>Full name</label><input id="name" type="text" placeholder="Your name" required><label>Email</label><input id="email" type="email" placeholder="you@example.com" required><label>Password</label><input id="password" type="password" minlength="6" placeholder="Minimum 6 characters" required><label>Referral code <small>(optional)</small></label><input id="referral" type="text" placeholder="ABC123"><button class="btn full">Create Account</button></form><p class="center">Already registered? <a href="login.html">Login</a></p><a href="index.html" class="back">← Back to home</a></div><script src="script.js"></script></body></html>
