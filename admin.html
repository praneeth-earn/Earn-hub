<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>EarnHub - Admin Panel</title>

    <link
        rel="stylesheet"
        href="style.css">

</head>

<body>


<header class="dash-nav">

    <div class="logo">
        Earn<span>Hub</span>
    </div>

    <a
        href="dashboard.html"
        class="admin-dashboard-link">
        Dashboard
    </a>

</header>


<main class="dashboard">


    <!-- ADMIN HEADER -->

    <section class="admin-header">

        <div>

            <h2>
                🛠️ Admin Panel
            </h2>

            <p>
                Review and manage submitted tasks.
            </p>

        </div>

    </section>


    <!-- ADMIN INFORMATION -->

    <section class="task-info">

        <div class="info-item">

            <span>📋</span>

            <div>

                <strong>
                    Submissions
                </strong>

                <small>
                    Review user tasks
                </small>

            </div>

        </div>


        <div class="info-item">

            <span>✓</span>

            <div>

                <strong>
                    Approve
                </strong>

                <small>
                    Add reward to balance
                </small>

            </div>

        </div>


        <div class="info-item">

            <span>✕</span>

            <div>

                <strong>
                    Reject
                </strong>

                <small>
                    Decline submissions
                </small>

            </div>

        </div>

    </section>


    <!-- SUBMISSIONS -->

    <div class="section-title">

        <div>

            <h2>
                Task Submissions
            </h2>

            <p>
                Review pending and completed submissions.
            </p>

        </div>

    </div>


    <div id="adminSubmissions"></div>


</main>


<script src="script.js"></script>

</body>

</html>
