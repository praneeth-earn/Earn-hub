<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>EarnHub - Admin</title>

    <link
        rel="stylesheet"
        href="style.css">

</head>


<body>


<header class="dash-nav">

    <div class="logo">
        Earn<span>Hub</span>
    </div>

    <a
        href="dashboard.html"
        class="back-btn">

        Dashboard

    </a>

</header>


<main class="dashboard">


    <section class="admin-header">

        <h2>
            Admin Panel
        </h2>

        <p>
            Review submitted tasks and approve or reject rewards.
        </p>

    </section>


    <div class="admin-stats">

        <div class="stat">
            <span>Pending submissions</span>
            <b id="pendingCount">0</b>
        </div>

        <div class="stat">
            <span>Approved</span>
            <b id="approvedCount">0</b>
        </div>

        <div class="stat">
            <span>Rejected</span>
            <b id="rejectedCount">0</b>
        </div>

    </div>


    <h2 class="admin-section-title">
        Task Submissions
    </h2>


    <div id="adminSubmissions"></div>


</main>


<script src="script.js"></script>

</body>

</html>
